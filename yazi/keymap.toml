"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

# --- Manager keybindings ---
[[mgr.prepend_keymap]]
on   = [ "<Enter>" ]
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = [ "l" ]
run  = "plugin smart-enter"
desc = "Enter directory or open file"

# --- Chmod ---
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

# --- Shell ---
[[mgr.prepend_keymap]]
on   = [ "<C-s>" ]
run  = "shell '$SHELL' --block --confirm"
desc = "Open shell here"

# --- Goto bookmarks ---
[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Goto Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/.config"
desc = "Goto .config"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Desktop"
desc = "Goto Desktop"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Projects"
desc = "Goto Projects"

[[mgr.prepend_keymap]]
on   = [ "g", "t" ]
run  = "cd /tmp"
desc = "Goto /tmp"

# --- Zoxide jump ---
[[mgr.prepend_keymap]]
on   = [ "z" ]
run  = "plugin zoxide"
desc = "Jump with zoxide"

# --- Fzf search ---
[[mgr.prepend_keymap]]
on   = [ "<C-f>" ]
run  = '''shell 'fd --type f --hidden --follow --exclude .git | fzf --preview "bat --color=always --style=numbers --line-range=:500 {}" | xargs -r ya emit reveal' --block'''
desc = "Fuzzy search files with fzf"

# --- Bulk rename ---
[[mgr.prepend_keymap]]
on   = [ "b", "r" ]
run  = '''shell 'echo "$@" | vidir -' --block --confirm'''
desc = "Bulk rename selected files"

# --- Archive creation ---
[[mgr.prepend_keymap]]
on   = [ "b", "z" ]
run  = '''shell 'name="${1%.*}"; zip -r "$name.zip" "$@"' --confirm'''
desc = "Zip selected files"

[[mgr.prepend_keymap]]
on   = [ "b", "t" ]
run  = '''shell 'name="${1%.*}"; tar czf "$name.tar.gz" "$@"' --confirm'''
desc = "Tar.gz selected files"

# --- Copy file path ---
[[mgr.prepend_keymap]]
on   = [ "y", "p" ]
run  = '''shell 'echo -n "$1" | pbcopy' --confirm'''
desc = "Copy file path to clipboard"

[[mgr.prepend_keymap]]
on   = [ "y", "n" ]
run  = '''shell 'echo -n "$(basename "$1")" | pbcopy' --confirm'''
desc = "Copy filename to clipboard"

# --- Toggle hidden files ---
[[mgr.prepend_keymap]]
on   = [ "." ]
run  = "hidden toggle"
desc = "Toggle hidden files"

# --- Tab operations ---
[[mgr.prepend_keymap]]
on   = [ "t" ]
run  = "tab_create --current"
desc = "Create new tab in current dir"

[[mgr.prepend_keymap]]
on   = [ "T" ]
run  = "tab_create"
desc = "Create new tab in home"

[[mgr.prepend_keymap]]
on   = [ "1" ]
run  = "tab_switch 0"
desc = "Switch to tab 1"

[[mgr.prepend_keymap]]
on   = [ "2" ]
run  = "tab_switch 1"
desc = "Switch to tab 2"

[[mgr.prepend_keymap]]
on   = [ "3" ]
run  = "tab_switch 2"
desc = "Switch to tab 3"

[[mgr.prepend_keymap]]
on   = [ "4" ]
run  = "tab_switch 3"
desc = "Switch to tab 4"
